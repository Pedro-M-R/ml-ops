services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
  treino:
    build: .
    profiles: ["treino"]
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/runtime/mlflow.db
    volumes:
      - ./data:/app/data
      - ./deployment:/app/deployment
      - ./reports:/app/reports
      - ./mlartifacts:/app/mlartifacts
      - ./runtime:/app/runtime
    command: churn-tune --jobs 2
