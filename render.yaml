# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: churn-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: MLFLOW_DISABLE_AGENT_HINT
        value: "1"
