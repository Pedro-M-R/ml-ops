[project]
name = "churn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "pydantic-settings==2.6.1",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[project.scripts]
churn-train = "churn.model:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
